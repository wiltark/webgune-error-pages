# Serveur de pages d'erreur webgune branché sur Traefik (provider Docker / labels).
# Prérequis : un réseau Traefik externe nommé "traefik" (adaptez si besoin).
#
#   docker compose up -d
#
services:
  error-pages:
    image: nginx:alpine
    container_name: webgune-error-pages
    restart: unless-stopped
    volumes:
      - ./pages:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # ── Service ──
      - "traefik.http.services.webgune-error-pages.loadbalancer.server.port=80"

      # ── Middleware "errors" : remplace TOUTES les erreurs HTTP par nos pages ──
      #   {status} est remplacé par le code réel -> /404.html, /403.html, /502.html...
      #   ⚠ Pour des routeurs d'API, restreignez (ex: 404,500-504) afin de ne PAS
      #     remplacer les réponses 401/403/429 ou les corps JSON par du HTML.
      - "traefik.http.middlewares.webgune-errors.errors.status=400-599"
      - "traefik.http.middlewares.webgune-errors.errors.service=webgune-error-pages"
      - "traefik.http.middlewares.webgune-errors.errors.query=/{status}.html"

      # ── Routeur catch-all : accès direct par IP ou domaine non rattaché ──
      #   priority=1 -> tous les vrais routeurs (priorité plus élevée) passent avant.
      - "traefik.http.routers.webgune-catchall.rule=PathPrefix(`/`)"
      - "traefik.http.routers.webgune-catchall.priority=1"
      - "traefik.http.routers.webgune-catchall.entrypoints=web,websecure"
      - "traefik.http.routers.webgune-catchall.service=webgune-error-pages"
      # Optionnel : TLS sur le catch-all (certificat par défaut)
      # - "traefik.http.routers.webgune-catchall.tls=true"

networks:
  default:
    name: traefik
    external: true
