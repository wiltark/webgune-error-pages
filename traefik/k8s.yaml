# Déploiement Kubernetes des pages d'erreur webgune (Traefik en IngressController).
# Les pages sont injectées via ConfigMap -> régénérez le ConfigMap avec :
#   kubectl create configmap webgune-error-pages \
#     --from-file=pages/ -n traefik --dry-run=client -o yaml | kubectl apply -f -
#
# (ce fichier ne contient PAS le HTML : il monte le ConfigMap ci-dessus dans nginx)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgune-error-pages
  namespace: traefik
spec:
  replicas: 1
  selector:
    matchLabels: { app: webgune-error-pages }
  template:
    metadata:
      labels: { app: webgune-error-pages }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: pages
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: pages
          configMap:
            name: webgune-error-pages
---
apiVersion: v1
kind: Service
metadata:
  name: webgune-error-pages
  namespace: traefik
spec:
  selector: { app: webgune-error-pages }
  ports:
    - port: 80
      targetPort: 80
---
# Middleware errors : 404 + 5xx -> nos pages, avec le code réel injecté dans l'URL
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webgune-errors
  namespace: traefik
spec:
  errors:
    # Toutes les erreurs HTTP -> nos pages.
    # ⚠ Pour des routeurs d'API, restreignez (ex: "404", "500-504") afin de ne pas
    #   remplacer les réponses 401/403/429 ou les corps JSON par du HTML.
    status:
      - "400-599"
    service:
      name: webgune-error-pages
      port: 80
    query: "/{status}.html"
---
# Référez ce middleware depuis vos IngressRoute :
#   spec.routes[].middlewares:
#     - name: webgune-errors
#       namespace: traefik
#
# Pour le catch-all (IP / domaine non configuré), créez un IngressRoute de faible
# priorité qui matche tout et pointe vers le service webgune-error-pages :
#
# apiVersion: traefik.io/v1alpha1
# kind: IngressRoute
# metadata: { name: webgune-catchall, namespace: traefik }
# spec:
#   entryPoints: [web, websecure]
#   routes:
#     - match: "PathPrefix(`/`)"
#       priority: 1
#       kind: Rule
#       services:
#         - name: webgune-error-pages
#           port: 80
